<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Certificados Oficiales</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; margin-right: 10px; }
        button:hover { background-color: #0056b3; }
        .btn-download { background-color: #28a745; display: none; }
        .btn-download:hover { background-color: #218838; }
        #resultado { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; white-space: pre-wrap; font-family: monospace; }
        #pantalla-error { background: #ffebee; color: #c62828; border: 2px solid #ef5350; padding: 15px; margin-bottom: 20px; display: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="pantalla-error"></div>

    <h2>Emisión de Certificado de Hoja de Vida</h2>
    <p>Ingrese la cédula del asambleísta para generar el documento oficial.</p>

    <form id="formCertificado">
        <div class="form-group">
            <label for="cedula">Cédula de Identidad:</label>
            <input type="text" id="cedula" placeholder="Ej: 1712345678" required>
        </div>
        <button type="submit" id="btnGenerar">Generar Certificado</button>
        <button type="button" id="btnDescargar" class="btn-download" onclick="descargarTexto()">Descargar Archivo .txt</button>
    </form>

    <div id="resultado" style="display: none;"></div>

    <script>

        let textoCertificadoGlobal = "";
        let folioGlobal = "";


        document.getElementById("formCertificado").addEventListener("submit", async function(event) {
      
            event.preventDefault(); 
            
            const cedulaInput = document.getElementById("cedula").value.trim();
            const btnGenerar = document.getElementById("btnGenerar");
            const divResultado = document.getElementById("resultado");
            const btnDescargar = document.getElementById("btnDescargar");
            const contenedorError = document.getElementById("pantalla-error");


            contenedorError.style.display = "none";
            divResultado.style.display = "none";
            btnDescargar.style.display = "none";

   
            if (!window.supabase) {
                contenedorError.innerText = " Error: La librería de Supabase no pudo cargarse en tu navegador. Revisa si tienes internet o si extensiones tipo AdBlock están bloqueando scripts externos.";
                contenedorError.style.display = "block";
                return;
            }

           
            const SUPABASE_URL = "https://bwapdvxxruxoqxeoajva.supabase.co"; 
            const SUPABASE_ANON_KEY = "sb_publishable_ji7OIxDlNufPR11bW28yRw_N5eXwVGq"; 

   
            if (SUPABASE_URL.includes("TU_PROYECTO_REAL")) {
                contenedorError.innerText = " Configuración pendiente: Te falta poner tu URL y tu Anon Key reales de Supabase en el código (líneas 54 y 55).";
                contenedorError.style.display = "block";
                return;
            }

            btnGenerar.innerText = "Procesando...";
            btnGenerar.disabled = true;

            try {
                // Conexión en caliente
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // Llamada a tu RPC
                const { data, error } = await supabase.rpc('generar_certificado_asambleista', {
                    p_cedula: cedulaInput
                });

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error("No existe ningún registro con esa cédula.");
                }

                const registro = data[0];
                textoCertificadoGlobal = registro.contenido_certificado;
                folioGlobal = registro.folio;

                // Pintar texto plano estructurado
                divResultado.innerText = textoCertificadoGlobal;
                divResultado.style.display = "block";
                
                // Mostrar botón para bajar el .txt
                btnDescargar.style.display = "inline-block";

            } catch (err) {
                console.error(err);
                contenedorError.innerText = " Error en consulta: " + (err.message || "No se pudo conectar al servidor.");
                contenedorError.style.display = "block";
            } finally {
                btnGenerar.innerText = "Generar Certificado";
                btnGenerar.disabled = false;
            }
        });

        function descargarTexto() {
            if (!textoCertificadoGlobal) return;
            const blob = new Blob([textoCertificadoGlobal], { type: "text/plain;charset=utf-8" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${folioGlobal}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
