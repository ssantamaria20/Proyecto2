<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asamblea</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Registro de Asambleístas</h1>
    
    <form id="formAsambleista">
        <label>Cédula:</label><br>
        <input type="text" id="cedula" required><br><br>

        <label>Nombre:</label><br>
        <input type="text" id="nombre" required><br><br>

        <label>Primer Apellido:</label><br>
        <input type="text" id="apellido1" required><br><br>

        <label>Segundo Apellido:</label><br>
        <input type="text" id="apellido2"><br><br>

        <label>Correo Electrónico:</label><br>
        <input type="email" id="correo" required><br><br>

        <button type="submit">Registrar Asambleísta</button>
    </form>

    <script>
        // 1. CONFIGURACIÓN DE CREDENCIALES
        const SUPABASE_URL = "https://bwapdvxxruxoqxeoajva.supabase.co"; 
        
    
        const SUPABASE_KEY = "sb_publishable_ji7OIxDlNufPR11bW28yRw_N5eXwVGq";

    
        const supabaseCliente = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. CAPTURAR EL EVENTO DEL FORMULARIO
        document.getElementById('formAsambleista').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const cedula = document.getElementById('cedula').value;
            const nombre = document.getElementById('nombre').value;
            const primer_apellido = document.getElementById('apellido1').value;
            const segundo_apellido = document.getElementById('apellido2').value;
            const correo = document.getElementById('correo').value;

            try {
                // Usamos el nuevo nombre del cliente
                const { data, error } = await supabaseCliente
                    .from('asambleistas')
                    .insert([
                        { 
                            cedula: cedula, 
                            nombre: nombre, 
                            primer_apellido: primer_apellido, 
                            segundo_apellido: segundo_apellido || null, 
                            correo: correo 
                        }
                    ]);

                if (error) throw error;

                alert("¡Asambleista registrado");
                document.getElementById('formAsambleista').reset(); 

            } catch (error) {
                console.error(error);
                alert("Hubo un error al guardar: " + error.message);
            }
        });
    </script>

</body>
</html>
